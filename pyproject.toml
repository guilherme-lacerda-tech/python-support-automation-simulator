[project]
name = "python-support-automation-simulator"
version = "0.2.0"
description = "Synthetic support automation simulator with tickets, queues, rules and SQLite."
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
